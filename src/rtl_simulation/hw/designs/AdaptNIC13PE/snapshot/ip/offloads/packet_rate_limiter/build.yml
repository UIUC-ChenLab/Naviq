name: packet_rate_limiter
id: offloads/packet_rate_limiter
defaults:
  top_params:
    DATA_WIDTH: 512
    MAX_FLOWS: 4096
    PACKET_FIFO_DEPTH: 64
    PARSER_FIFO_DEPTH: 4
    META_FIFO_DEPTH: 64
    TABLE_ASSOCIATIVITY: 4
    MAX_PACKET_BEATS: 24
    COUNTER_START_VALUE: 0
rtl:
  - rtl/packet_rate_limiter_ingress.sv
  - rtl/packet_rate_limiter_egress.sv
  - rtl/packet_rate_limiter.sv
deps:
  - lib/other/axi
  - lib/other/bram
  - lib/other/counter
  - lib/other/header_parsers
  - lib/other/toeplitz_hash
  - lib/other/sync_bram_fifo
  - lib/other/sync_ff_fifo
  - lib/axis/axis_fifo
  - lib/axil/axil_hash_table
tb:
  default_config: tb/config.json
  tests:
    - tb/packet_rate_limiter
  include_dirs:
    - tb
