name: overloaded_nat
id: offloads/overloaded_nat
defaults:
  top_params:
    TABLE_DEPTH: 1024
    TABLE_ENTRIES: 256
    DATA_WIDTH: 512
    PKT_BUF_DEPTH: 0
    PKT_BUF_BYTES: 4096
    ASSOCIATIVITY: 4
    EXTRA_OUTPUT_REG: 0
rtl:
  - rtl/_pat_pkg.sv
  - rtl/overloaded_nat.sv
  - rtl/pat_csr.sv
  - rtl/pat_free_list.sv
  - rtl/pat_managed_hash_table.sv
  - rtl/pat_rewrite.sv
deps:
  - lib/other/axi
  - lib/other/bram
  - lib/other/hash_table
  - lib/other/header_parsers
  - lib/other/sync_bram_fifo
  - lib/other/sync_ff_fifo
  - lib/other/toeplitz_hash
  - lib/axis/axis_multicast
  - lib/axil/lookup_table
tb:
  default_config: tb/config.json
  tests:
    - tb/overloaded_nat
  include_dirs:
    - tb
