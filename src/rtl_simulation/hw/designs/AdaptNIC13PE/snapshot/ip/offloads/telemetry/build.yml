name: telemetry
id: offloads/telemetry
defaults:
  top_params:
    NUM_TRACKED_FLOWS: 4096
    TOTAL_BYTES_WIDTH: 32
    TOTAL_PACKETS_WIDTH: 32
    DATA_WIDTH: 512
rtl:
  - rtl/accumulator.sv
  - rtl/telemetry.sv
  - rtl/telemetry_accumulators.sv
deps:
  - lib/other/axi
  - lib/axis/axis_count_beat_size
  - lib/axis/axis_register_slice
  - lib/other/header_parsers
  - lib/axis/parse_and_hash_packet
  - lib/other/bram
tb:
  default_config: tb/config.json
  tests:
    - tb/telemetry
  include_dirs:
    - tb
