name: uro
id: offloads/uro
defaults:
  top_params:
    DATA_WIDTH: 512
    NUM_URO_QUEUES: 8
    INPUT_SELECTOR_DEPTH: 2
    OUTPUT_SELECTOR_DEPTH: 3
    PARSER_FRAGMENT_PACKER_PAGE_COUNT: 8
    TIMEOUT_COUNTER_WIDTH: 16
    TIMEOUT_PRESCALER_WIDTH: 16
    MAX_URO_QUEUE_BYTES: 9000
  impl_strategy: Performance_NetDelay_high
  gclk_deskew: CALIBRATED
  post_route_phys_opt: true
rtl:
  - rtl/_uro_pkg.sv
  - rtl/_uro_interfaces.sv
  - rtl/uro_csr.sv
  - rtl/uro_rx_stage.sv
  - rtl/uro_queue.sv
  - rtl/uro_payload_router.sv
  - rtl/uro_fixed_header_strip.sv
  - rtl/uro_packet_capture.sv
  - rtl/uro_flow_table.sv
  - rtl/uro_dispatch.sv
  - rtl/uro_queue_bank.sv
  - rtl/uro_output_formatter.sv
  - rtl/uro.sv
deps:
  - lib/other/axi
  - lib/other/toeplitz_hash
  - lib/other/header_parsers
  - lib/other/sync_bram_fifo
  - lib/other/sync_ff_fifo
  - lib/other/counter
  - lib/axis/axis_combine_repack
  - lib/axis/axis_packet_fifo
  - lib/axis/axis_packet_arbiter
  - lib/axis/axis_demux
  - lib/axis/axis_register_slice
  - lib/axis/axis_fifo
  - lib/axil/axil_crossbar
  - lib/axil/axil_hash_table
tb:
  default_config: tb/config.json
  verilator_flags:
    # Parser control streams may be narrower than one byte; their tkeep is unused.
    - -Wno-ASCRANGE
    # The parser scanner has a guarded wide-header slice at narrow data widths.
    - -Wno-SELRANGE
  tests:
    - tb/uro
  include_dirs:
    - tb
