name: aes_ctr_tunnel_rx
id: offloads/aes_ctr_tunnel_rx
defaults:
  top_params:
    DATA_WIDTH: 512
    SA_TABLE_DEPTH: 1024
    SA_ID_WIDTH: 10
    MAX_PACKET_BYTES: 2048
rtl:
  - rtl/aes_ctr_tunnel_rx_pkg.sv
  - rtl/aes_ctr_rx_ingress.sv
  - rtl/aes_ctr_rx_egress.sv
  - rtl/aes_ctr_tunnel_rx.sv
deps:
  - lib/other/axi
  - lib/other/bram
  - lib/other/header_parsers
  - lib/axis/axis_fifo
  - lib/axis/axis_serializer
  - lib/axis/axis_strip_repack
  - lib/axis/axis_fragment_packer
  - lib/axis/axis_multicast
  - lib/axil/axil_crossbar
  - lib/crypto/aes_ctr
  - offloads/aes_ctr_tunnel_tx
tb:
  default_config: tb/config.json
  tests:
    - tb/aes_ctr_tunnel_rx
    - tb/aes_ctr_tunnel_loopback
  include_dirs:
    - ../common/include
    - tb
  ldflags:
    - -LDFLAGS
    - -lcrypto
  verilator_flags:
    - -Wno-ASCRANGE
