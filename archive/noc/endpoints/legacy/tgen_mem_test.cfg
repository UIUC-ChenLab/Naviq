# TrafficGen configuration for CpuNocBridge testing
# Format: STATE state_id duration_ns gen_type [gen_params...] next_state [prob]
#
# Gen types:
#   IDLE - no traffic
#   LINEAR - sequential address pattern
#   RANDOM - random address pattern
#
# LINEAR params: rate start_addr end_addr block_size min_period max_period read_percent
# RANDOM params: rate start_addr end_addr block_size min_period max_period read_percent
#
# This config does 100 random transactions to DDR range, 50% reads/50% writes

# State 0: Generate random traffic for 1ms (1,000,000 ns)
# Parameters: rate=0 (no throttling), addr_range=0x0-0x1000000 (16MB), 
#             block_size=64, period=1000-1000ns, read_percent=50
STATE 0 1000000000 RANDOM 0 0x0 0x1000000 64 1000 1000 50 0
